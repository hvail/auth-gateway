name: Build Docker Image

on:
  push:
    branches:
      - call

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2.2.0
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: ${{ secrets.DOCKER_ALIYUN_CHOCO_USERNAME }}
        password: ${{ secrets.DOCKER_ALIYUN_CHOCO_PASSWORD }}
        logout: false

    - name: Build Docker image
      uses: docker/build-push-action@v2
      with:
        context: .
        file: Dockerfile
        push: true
        tags: 
          - registry.cn-shenzhen.aliyuncs.com/lib-choco/com.choco.power-oauth2:callback

